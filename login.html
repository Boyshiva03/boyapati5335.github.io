<div class="container" style="background: rgba(0, 0, 0, 0.5); padding: 60px; border-radius: 20px; max-width: 400px; margin: 100px auto; color: white;">
    <br><h2>Sign In</h2></br>
    <br><input type="text" id="userInput" placeholder="Username"></br>
    <br><input type="password" id="passInput" placeholder="Password"></br>
    
    <br><button id="action-btn" onclick="validateLogin()">Submit</button></br>
    
    <p id="error-msg" style="color: #ff4d4d; display: none; font-size: 0.8rem;">Invalid Credentials!</p>
    <p><a href="index.html" style="color: white; font-size: 0.8rem;">Go Back Home</a></p>
</div>


<script>
    // Stored SHA-256 hash instead of plain-text passwords
    const AUTH_DATABASE = {
        "admin": "7b72db5ec88a6d05ca1ec1f8c857beaeec966601b0f55b1f9b37c02b1154f85a"
    };

    // Helper: hash input text with SHA-256
    async function sha256(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function validateLogin() {
        const usernameInput = document.getElementById('userInput').value.trim();
        const passwordInput = document.getElementById('passInput').value;
        const errorMsg = document.getElementById('error-msg');

        if (!AUTH_DATABASE[usernameInput]) {
            errorMsg.style.display = 'block';
            return;
        }

        const hashedAttempt = await sha256(passwordInput);

        if (hashedAttempt === AUTH_DATABASE[usernameInput]) {
            // Save authentication state along with a creation timestamp
            sessionStorage.setItem("isLoggedIn", "true");
            sessionStorage.setItem("lastActiveTime", Date.now().toString());
            window.location.href = "events.html";
        } else {
            errorMsg.style.display = 'block';
            document.getElementById('passInput').value = "";
        }
    }

    // Dynamic background selector
    const myImages = ['images/img1.JPG', 'images/img2.JPG', 'images/img3.JPG'];
    document.body.style.backgroundImage = "url('" + myImages[Math.floor(Math.random() * myImages.length)] + "')";
</script>
