<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - My World</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Sign In</h2>
        <input type="text" id="userInput" placeholder="Username">
        <input type="password" id="passInput" placeholder="Password">
        
        <button id="action-btn" type="button" onclick="validateLogin()">Submit</button>
        
        <p id="error-msg" style="color: #ff4d4d; display: none; font-size: 0.8rem; margin-top: 10px;">Invalid Credentials!</p>
        <p><a href="index.html" style="color: white; font-size: 0.8rem; text-decoration: underline;">Go Back Home</a></p>
    </div>

    <script>
        // Store both valid hash variants so login works reliably
        const AUTH_DATABASE = {
            "admin": [
                "31a79bb331fac359221c292b76428f08ad29f55a2257e4e88dc996e84c016203",
                "7b72db5ec88a6d05ca1ec1f8c857beaeec966601b0f55b1f9b37c02b1154f85a"
            ]
        };

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function validateLogin() {
            const userInput = document.getElementById('userInput');
            const passInput = document.getElementById('passInput');
            const errorMsg = document.getElementById('error-msg');

            const username = userInput.value.trim().toLowerCase();
            const password = passInput.value.trim();

            if (!AUTH_DATABASE[username]) {
                errorMsg.style.display = 'block';
                return;
            }

            try {
                const hashedAttempt = await sha256(password);
                const allowedHashes = AUTH_DATABASE[username];

                if (allowedHashes.includes(hashedAttempt)) {
                    sessionStorage.setItem("isLoggedIn", "true");
                    sessionStorage.setItem("lastActiveTime", Date.now().toString());
                    window.location.href = "events.html";
                } else {
                    errorMsg.style.display = 'block';
                    passInput.value = "";
                }
            } catch (err) {
                console.error("Login verification failed:", err);
            }
        }

        // Allow pressing Enter key to submit
        document.addEventListener('DOMContentLoaded', () => {
            const passField = document.getElementById('passInput');
            if (passField) {
                passField.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        validateLogin();
                    }
                });
            }
        });

        // Background randomizer
        const myImages = ['images/imglog1.webp'];
        if (myImages.length > 0) {
            document.body.style.backgroundImage = "url('" + myImages[Math.floor(Math.random() * myImages.length)] + "')";
        }
        <title>Shivanshi Boyapati</title>
    </script>
</body>
</html>
